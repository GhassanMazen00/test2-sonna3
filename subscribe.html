<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var l=localStorage.getItem('sonnaLang');if(l==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';}else if(l==='ar'){document.documentElement.lang='ar';document.documentElement.dir='rtl';}var th=localStorage.getItem('sonnaTheme');if(!th){th='light';}document.documentElement.setAttribute('data-theme',th);}catch(e){}})();</script>
<title>باقات اشتراك المصانع | Factory Subscriptions — Sonnaع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Cairo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/css/style.css">
<script defer data-domain="sonna3.net" src="https://plausible.io/js/script.js"></script>
</head>
<body>
<div id="app"></div>
<script src="assets/js/icons.js"></script>
<script src="assets/js/lang.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/chat.js"></script>
<script>
function renderPlans(currentPlan) {
  document.getElementById('app').innerHTML = headerHTML() + mobileMenuHTML() + '<main>' +
    '<div class="plans-page">' +
      '<div class="info-hero" style="padding-bottom:12px">' +
        '<span class="eyebrow">' + ICONS.shieldCheck + ' ' + t('plans_hero_eyebrow') + '</span>' +
        '<h1>' + t('tiers_title') + '</h1>' +
        '<p>' + t('tiers_sub') + '</p>' +
      '</div>' +
      '<div class="plans-wrap">' + pricingTableHTML(currentPlan) + '</div>' +
      '<p class="plan-note" style="text-align:center;margin:22px auto 70px;max-width:560px">' + ICONS.shieldCheck + ' ' + t('plan_pay_note') + '</p>' +
    '</div>' +
  '</main>' + footerHTML();
}

document.addEventListener('DOMContentLoaded', function () {
  AdminStore.bootstrap().then(function () {
    var s = localStorage.getItem('sonnaLang'); if (s === 'en' || s === 'ar') LANG = s;
    document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
    renderPlans('');   // render immediately…
    // …then highlight the owner's current plan once we know it.
    if (window.Auth && Auth.isLoggedIn() && Auth.myVerifiedPlan) {
      Auth.myVerifiedPlan().then(function (p) { if (p) renderPlans(p); }).catch(function () {});
    }
  });
});
</script>
</body>
</html>
