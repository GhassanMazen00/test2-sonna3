<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<script>(function(){try{var l=localStorage.getItem('sonnaLang');if(l==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';}else if(l==='ar'){document.documentElement.lang='ar';document.documentElement.dir='rtl';}var th=localStorage.getItem('sonnaTheme');if(!th){th='light';}document.documentElement.setAttribute('data-theme',th);}catch(e){}})();</script>
<title>إعادة تعيين كلمة المرور | Reset password · Sonnaع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Cairo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="stylesheet" href="assets/css/style.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-6F33W60CWR"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-6F33W60CWR');</script>
</head>
<body>
<div id="app"></div>
<script src="assets/js/icons.js"></script>
<script src="assets/js/lang.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/chat.js"></script>
<script>
function shell(body) { document.getElementById('app').innerHTML = headerHTML() + mobileMenuHTML() + '<main>' + body + '</main>' + footerHTML(); }

function card(inner) {
  return '<div class="container" style="max-width:460px;padding:56px 24px 72px">' +
    '<div class="panel" style="text-align:center">' + inner + '</div>' +
  '</div>';
}

// Grab the recovery token Supabase appended to the URL hash.
function recoveryToken() {
  try {
    var h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    if (h.get('type') === 'recovery' && h.get('access_token')) return h.get('access_token');
  } catch (e) {}
  return '';
}

function renderReset() {
  var token = recoveryToken();
  if (!token) {
    shell(card(
      '<span class="ci" style="width:52px;height:52px;background:#FEE4E2;color:#B42318;border-radius:15px;display:inline-grid;place-items:center;margin-bottom:12px">' + (ICONS.shieldCheck || '!') + '</span>' +
      '<h1 style="font-size:22px;margin-bottom:8px">' + t('rp_title') + '</h1>' +
      '<p class="muted" style="margin-bottom:18px">' + t('rp_invalid') + '</p>' +
      '<a class="btn btn-primary" href="index.html">' + t('rp_to_login') + '</a>'
    ));
    return;
  }
  shell(card(
    '<span class="ci" style="width:52px;height:52px;background:var(--teal-tint);color:var(--teal);border-radius:15px;display:inline-grid;place-items:center;margin-bottom:12px">' + (ICONS.user || '') + '</span>' +
    '<h1 style="font-size:22px;margin-bottom:6px">' + t('rp_title') + '</h1>' +
    '<p class="muted" style="margin-bottom:18px">' + t('rp_sub') + '</p>' +
    '<div class="au-err" id="rpErr" style="display:none"></div>' +
    '<div class="form-grid" style="text-align:start">' +
      '<div class="form-field full"><label>' + t('rp_new') + '</label><input id="rp_new" type="password"></div>' +
      '<div class="form-field full"><label>' + t('rp_confirm') + '</label><input id="rp_confirm" type="password"></div>' +
    '</div>' +
    '<div style="margin-top:16px"><button class="btn btn-primary" id="rpSave" style="width:100%">' + t('rp_save') + '</button></div>'
  ));
  var btn = document.getElementById('rpSave');
  btn.onclick = function () {
    var err = document.getElementById('rpErr');
    var show = function (m) { err.textContent = m; err.style.display = 'block'; };
    var p1 = document.getElementById('rp_new').value || '';
    var p2 = document.getElementById('rp_confirm').value || '';
    if (p1.length < 6) { show(t('rp_short')); return; }
    if (p1 !== p2) { show(t('rp_mismatch')); return; }
    err.style.display = 'none';
    btn.disabled = true; btn.textContent = '…';
    Auth.updatePassword(token, p1).then(function () {
      shell(card(
        '<span class="ci" style="width:52px;height:52px;background:#E7F6EC;color:#1FA855;border-radius:15px;display:inline-grid;place-items:center;margin-bottom:12px">' + (ICONS.check || '✓') + '</span>' +
        '<h1 style="font-size:22px;margin-bottom:8px">' + t('rp_saved') + '</h1>' +
        '<a class="btn btn-primary" href="index.html">' + t('rp_to_login') + '</a>'
      ));
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = t('rp_save');
      show(e.message || String(e));
    });
  };
}

document.addEventListener('DOMContentLoaded', function () {
  AdminStore.bootstrap().then(function () {
    var s = localStorage.getItem('sonnaLang'); if (s === 'en' || s === 'ar') LANG = s;
    document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
    renderReset();
  });
});
</script>
<script src="assets/js/native.js"></script>
</body>
</html>
